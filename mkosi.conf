# Immutable Arch Distribution - Base Configuration
# This creates a bootable disk image with systemd-boot and A/B partition support

[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
ImageId=immutable-arch
ImageVersion=0.1.0
Format=disk
OutputDirectory=build
Output=%i_%v
# Use compression for the output image and initramfs
# Higher compression level to reduce initramfs size (per Arch wiki recommendation)
CompressOutput=yes
CompressLevel=9

[Content]
# Create a bootable image with systemd-boot
Bootable=yes
Bootloader=systemd-boot

# Base packages for the immutable system
# Prioritizing systemd ecosystem tools as per requirements
# Following Arch installation guide recommendations
Packages=
        # Base system (essential per Arch install guide)
        base
        linux
        linux-firmware
        # CPU microcode (for both Intel desktop and AMD homelab)
        intel-ucode
        amd-ucode
        # Systemd components
        systemd
        systemd-sysvcompat
        systemd-resolvconf
        # Boot and partition management
        systemd-ukify
        # Networking (using systemd-networkd/resolved as per requirements)
        iwd
        # Documentation (recommended by Arch install guide)
        man-db
        man-pages
        # Core utilities
        bash
        coreutils
        util-linux
        # Package management
        pacman
        # For building AUR packages later (via paru)
        base-devel
        git
        # Text editors for emergency repairs and config
        vim
        nano
        # Security
        sudo
        openssh
        # File systems utilities (for your chosen filesystems)
        btrfs-progs
        dosfstools
        e2fsprogs
        xfsprogs
        # Hardware support
        nvme-cli
        usbutils
        pciutils

# Enable these systemd services by default
MakeInitrd=yes

# Set a default root password (CHANGE THIS in production!)
RootPassword=root

# Clean package metadata to save space
CleanPackageMetadata=yes

[Validation]
# Enable secure boot support (can be configured later)
SecureBoot=no

[Build]
# Use incremental builds for faster iteration
Incremental=yes
# Cache directory for incremental builds
CacheDirectory=build/mkosi.cache
